name: Workflow lint

on:
  pull_request:
    paths: [".github/workflows/**"]

permissions:
  contents: read

jobs:
  # Static security audit of the workflows themselves (template injection, over-broad permissions, ...).
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Audit workflows
        run: uvx zizmor --min-severity high .github/workflows

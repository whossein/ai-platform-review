name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: 0 # no git hooks in CI; semantic-release's own release commit must not be linted

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag, GitHub release, version commit
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run lint
      - run: npm test
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Empty when semantic-release found nothing to release.
      - id: tag
        run: echo "tag=$(git tag --points-at HEAD)" >> "$GITHUB_OUTPUT"

  # Runs in the same workflow because releases/tags created with GITHUB_TOKEN don't trigger other workflows.
  desktop:
    needs: release
    if: needs.release.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # electron-builder fetches its own Electron
      - run: npm run build:desktop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # ponytail: unsigned; add signing secrets when needed
      - name: Upload to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" release/*.{exe,dmg,zip,AppImage} --clobber

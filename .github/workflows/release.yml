name: Release

# Manual only: Actions > Release > Run workflow (on main).
#   1. action: release           → lint + test, then semantic-release tags vX.Y.Z and creates the GitHub Release.
#   2. action: build-installers  → build desktop apps for a tag and attach them to its release
#                                  (version blank = latest release).
run-name: "${{ inputs.action == 'release' && 'Release' || format('Build installers {0}', inputs.version || '(latest)') }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        options: [release, build-installers]
        default: release
      version:
        description: Version for build-installers, e.g. 0.4.0 (blank = latest release)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: 0 # no git hooks in CI

jobs:
  release:
    name: Create release
    if: inputs.action == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # tag, GitHub release
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Typecheck
        run: npm run lint
      - name: Test
        run: npm test
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  resolve:
    name: Resolve version
    if: inputs.action == 'build-installers'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then TAG="v${VERSION#v}"; else TAG=$(gh release view --json tagName -q .tagName); fi
          gh release view "$TAG" >/dev/null # fail early if the release doesn't exist
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building installers for [$TAG](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Build ${{ matrix.os }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write # upload release assets
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      # Keep Electron + electron-builder downloads inside the workspace so one cache step covers every OS.
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore Electron and Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache
            .turbo/cache
          key: desktop-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ env.TAG }}
          restore-keys: desktop-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # electron-builder fetches its own Electron
      # Version lives only in the tag (main is PR-protected, so no release commit); stamp it for electron-builder.
      - name: Stamp version
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
        shell: bash
      - name: Build desktop app
        run: npm run build:desktop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # ponytail: unsigned; add signing secrets when needed
      - name: Upload to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(release/*.{exe,dmg,zip,AppImage,blockmap} release/latest*.yml) # latest*.yml + blockmaps feed electron-updater
          gh release upload "$TAG" "${files[@]}" --clobber
          { echo "### ${{ runner.os }} → $TAG"; printf -- '- %s\n' "${files[@]#release/}"; } >> "$GITHUB_STEP_SUMMARY"
